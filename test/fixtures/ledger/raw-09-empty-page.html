<script language="javascript">
 $(document).ready(function(){
	 
		doZBShowLine();

function doCheckSubmit(fbox, type){
	if(!hasOneChecked("CHECK_CONFIRM")){
		alert("请至少勾选一条记录。");
		return false;
	}
	
	if("delete" == type && !confirm("确实要删除吗？")){
		return false;
	}
	//启账日期
	var date="2020- 1- 1";
	//检查表单的日期不能小于启账日期
	if("update" == type){
		if(!checkLagerDate(v_dto6,date)) return false;
		checkFormIgnoreNames("mm_i;dd_i;voucherid_i;memo_i;debit_i;lend_i;balance_i;", true);
		return checkForm(fbox);
	}else{
		v_dto6.start.value='delete_loop'; 
		v_dto6.submit();  
		return;	 
	}
}

function checkLagerDate(form,date){//检查表单的日期不能小于启账日期
	   var f_mm = document.getElementsByName("mm");
	   var f_dd = document.getElementsByName("dd");
	   var f_box = document.getElementsByName("CHECK_CONFIRM");
	   var yyyy = date.split("-")[0];
	   var mm = date.split("-")[1];
	   var dd = date.split("-")[2];
	   for(var i=0;i<f_mm.length;i++){
	      if(f_box[i].checked){
	        if(parseInt(f_mm[i].value) < parseInt(mm)) {alert("第"+(i+1)+"行日期"+yyyy+"-"+f_mm[i].value+"-"+f_dd[i].value+"不能早于启账日期;"+date);return false;}
	        if((parseInt(f_mm[i].value) == parseInt(mm)) && (parseInt(f_dd[i].value) < parseInt(dd))) {alert("第"+(i+1)+"行日期"+yyyy+"-"+f_mm[i].value+"-"+f_dd[i].value+"不能早于启账日期;"+date);return false;}
	          }
		   }
	   return true;
	}

function doAddSubmit(fbox){//新增
	fbox.start.value = 'insert_1rec';
	checkFormIgnoreNames("mm_i;dd_i;voucherid_i;memo_i;debit_i;lend_i;balance_i;", false);
	if(",-1,0,1,2,6,7,".indexOf(","+fbox.rowclass.value+",") >= 0 && fbox.in_debit_lend_i.value == 0 && fbox.balance_i.value != 0){
		alert("余额不为0时，借贷方向不能为平。");
		return false;
	}
	if (checkForm(fbox)){
		var date=2020+"-"+$('#last_mm_id').val()+"-"+$('#last_dd_id').val();
		if(!checkIsDate(date)){
			alert('日期不合法!');
			return;
		}
		
		$("#btn_new").attr("disabled","disabled");
		fbox.submit();
	}
}

function type_do(arg_value,that)
{
	with(document.getElementById("voucherid_i")){disabled=true;value="";};
    with(document.getElementById("memo_i")){readOnly=true;value=""};
    with(document.getElementById('debit_i')){disabled=true; value="";};
    with(document.getElementById('lend_i')){disabled=true;  value="";};
    with(document.getElementById('in_debit_lend_i')){disabled=true;style.display = "none";};  
    with(document.getElementById('balance_i')){disabled=true;value="";};
	$("#voucherid_i").removeAttr("isnull");
	
	var o;
	if(that!=undefined){
		o = $(that).parent().parent().find("input[name='voucherid']")
		if(o!=undefined){
	          o.removeAttr("isnull");
	    }
    }
    
    //------------------------------------------------
	var fbox = v_dto6;
	var option = fbox.vouchertype_i.options[fbox.vouchertype_i.options.selectedIndex];
	fbox.memo_i.value = option.getAttribute("memo");
	fbox.rowclass.value = option.getAttribute("rowclass");
	fbox.isNormalRec_i.value = option.getAttribute("isNormalRec");
	//-----------------------------------------------
	if (arg_value=='初始' || arg_value=='期初' || arg_value=='月初' || arg_value=='年初') { 
        with(document.getElementById('in_debit_lend_i')){disabled=false;style.display = "block";};  
        document.getElementById('balance_i').disabled=false;  
    }
    else  if (arg_value=='月汇' || arg_value=='年累') { 
		document.getElementById('debit_i').disabled=false;  
		document.getElementById('lend_i').disabled=false;  
		with(document.getElementById('in_debit_lend_i')){disabled=false;style.display = "block";};  
		document.getElementById('balance_i').disabled=false;  
    }
    else if (arg_value=='--' || arg_value=='==')  { 
    	;
    }
    else if (arg_value=='年结') { 
		with(document.getElementById('in_debit_lend_i')){disabled=false;style.display = "block";};  
		document.getElementById('balance_i').disabled=false;  
    }
    else{ 
    
   	    if(arg_value=='记'||arg_value=='收'||arg_value=='付'){
           $("#voucherid_i").attr("isnull","notnull");
           if(o!=undefined){
           		o.attr("isnull","notnull");
           }
        }
    
        
		with(document.getElementById("voucherid_i")){disabled=false;select();};
		document.getElementById("memo_i").readOnly=false;
		document.getElementById('debit_i').disabled=false;  
		document.getElementById('lend_i').disabled=false; 
		with(document.getElementById('in_debit_lend_i')){disabled=false;style.display = "block";};  
		document.getElementById('balance_i').disabled=false; 
    }
}
function change_color(arg_value)
{ //选择 红字（冲销） 或 黑字(=1)
 color = '#000000';
 if (arg_value=='1') color = '#000000'; else color = '#FF0000';
 document.getElementById('debit_i').style.color= color ;  //FFFFFF
 document.getElementById('lend_i').style.color= color ;  //FFFFFF
}
